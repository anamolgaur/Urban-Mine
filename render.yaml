# Render Blueprint: New > Blueprint > pick this repo. ONE service hosts both the API and the web app at one address.
# `npm install` also builds the web app on Render (scripts/render-build.mjs), and the server then serves it: no Vercel, no CORS to set up.
# Values marked sync:false are secrets or per-environment: Render asks you for them in its dashboard. Never put them in this file.
services:
  - type: web
    name: urban-mine-api
    runtime: node
    region: singapore          # closest Render region to India
    plan: free                 # free instances sleep when idle: use a paid plan for a live service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL           # Supabase "Transaction pooler" connection string
        sync: false
      - key: SUPABASE_URL           # project URL (public)
        sync: false
      - key: SUPABASE_ANON_KEY      # publishable key (public)
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # optional: private photo storage (server only, secret)
        sync: false
      - key: ANTHROPIC_API_KEY           # optional: AI condition grade (server only, secret)
        sync: false
